<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#fbf7f4"/>
<meta name="description" content="NewIAS — a modern Civil Services learning platform."/>
<title>NewIAS — Civil Services Learning</title>
<style>
html,body{margin:0;min-height:100%;background:#fbf7f4;color:#382d31;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#startup-fallback{min-height:100dvh;display:grid;place-items:center;padding:22px;box-sizing:border-box}
.startup-card{width:min(100%,440px);box-sizing:border-box;padding:26px;border:1px solid #eadce2;border-radius:22px;background:#fffdfb;box-shadow:0 18px 54px #382d3118}
.startup-mark{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;background:#f7e5eb;color:#9b4c67;font-weight:850;font-size:18px}
.startup-card h1{font-size:25px;letter-spacing:-.04em;margin:18px 0 8px}
.startup-card p{font-size:14px;line-height:1.65;color:#796873}
.startup-card button{padding:11px 15px;border:0;border-radius:11px;background:#a95172;color:white;font-weight:700}
#startup-details{display:none;white-space:pre-wrap;overflow-wrap:anywhere;background:#f8edf1;padding:12px;border-radius:10px;font-size:12px}
</style>
</head>
<body>
<div id="root">
 <main id="startup-fallback">
  <section class="startup-card">
   <div class="startup-mark">N</div>
   <h1>Opening NewIAS…</h1>
   <p id="startup-message">Loading your secure learning workspace. If this screen stays here, the app could not start.</p>
   <pre id="startup-details"></pre>
   <button onclick="window.location.reload()">Reload app</button>
  </section>
 </main>
</div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
